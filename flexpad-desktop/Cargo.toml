[package]
name = "flexpad-desktop"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop configurator for the FlexPad macro pad"
license = "MIT"
publish = false

[[bin]]
name = "flexpad"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["canvas", "crisp", "linux-theme-detection", "tiny-skia", "tokio", "wayland", "web-colors", "wgpu", "x11"] }
serialport = "4.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt", "sync"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
