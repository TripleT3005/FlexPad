[package]
name = "flexpad-firmware"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "flexpad-firmware"
path = "src/bin/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32s3"] }
embassy-executor = "0.10.0"
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-storage = "0.3.1"
esp-storage = { version = "0.10.0", features = ["esp32s3", "embedded-storage"] }
embassy-usb = { version = "0.6.0", default-features = false }
static_cell = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
