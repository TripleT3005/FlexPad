include = ["esp-config.toml"]

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --chip esp32s3 --partition-table partitions.csv"
rustflags = ["-C", "link-arg=-nostartfiles", "-C", "link-arg=-Wl,--no-warn-rwx-segments"]

[build]
target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core"]
