name: CI desktop

on:
  pull_request:
    paths:
      - .github/workflows/ci-desktop.yml
      - .github/scripts/*.py
      - assets/icons/**
      - flexpad-desktop/**
      - flexpad-firmware/Cargo.toml
      - flexpad-firmware/CHANGELOG.md
      - flexpad-firmware/src/keys.rs
      - flexpad-firmware/src/layouts.rs
      - flexpad-firmware/src/protocol.rs
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: flexpad-desktop
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            flexpad-desktop/target
          key: cargo-${{ runner.os }}-${{ hashFiles('flexpad-desktop/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Test license script
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s ../.github/scripts

      - name: Check third-party licenses
        if: runner.os == 'Linux'
        run: python3 ../.github/scripts/third_party_licenses.py --rust-std --platform x86_64-pc-windows-msvc --platform x86_64-unknown-linux-gnu --platform aarch64-apple-darwin

