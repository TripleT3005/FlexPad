name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - assets/icons/**
      - installer/**
      - flexpad-desktop/Cargo.toml
      - flexpad-desktop/CHANGELOG.md
      - flexpad-desktop/build.rs
      - flexpad-desktop/src/flasher/**
      - flexpad-firmware/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      firmware_version: ${{ steps.version.outputs.firmware_version }}
      app_release: ${{ steps.check.outputs.app_release }}
      firmware_release: ${{ steps.check.outputs.firmware_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Read versions
        id: version
        run: |
          read_version() {
            sed -n 's/^version = "\(.*\)"$/\1/p' "$1" | head -n 1
          }
          newest_section() {
            sed -n 's/^## \[\([^]]*\)\].*/\1/p' "$1" | grep -vx Unreleased | head -n 1
          }
          for component in desktop firmware; do
            version=$(read_version "flexpad-$component/Cargo.toml")
            if [ -z "$version" ]; then
              echo "::error::flexpad-$component/Cargo.toml has no package version"
              exit 1
            fi
            section=$(newest_section "flexpad-$component/CHANGELOG.md")
            if [ "$section" != "$version" ]; then
              echo "::error::The newest section of flexpad-$component/CHANGELOG.md is '$section', but flexpad-$component/Cargo.toml has $version"
              exit 1
            fi
            case "$component" in
              desktop) echo "app_version=$version" >> "$GITHUB_OUTPUT" ;;
              firmware) echo "firmware_version=$version" >> "$GITHUB_OUTPUT" ;;
            esac
          done

      - name: Check for existing releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          FIRMWARE_VERSION: ${{ steps.version.outputs.firmware_version }}
        run: |
          is_new() {
            ! gh release view "$1" --repo "${{ github.repository }}" > /dev/null 2>&1
          }
          unreleased_is_empty() {
            ! awk '/^## \[Unreleased\]/ { found = 1; next } /^## \[/ { found = 0 } found && NF' "$1" | grep -q .
          }
          app_release=false
          firmware_release=false
          if is_new "v$APP_VERSION"; then
            app_release=true
            if ! unreleased_is_empty flexpad-desktop/CHANGELOG.md; then
              echo "::error::flexpad-desktop/CHANGELOG.md still has entries under [Unreleased]; move them into the section for $APP_VERSION"
              exit 1
            fi
          fi
          if is_new "firmware-v$FIRMWARE_VERSION"; then
            firmware_release=true
            if ! unreleased_is_empty flexpad-firmware/CHANGELOG.md; then
              echo "::error::flexpad-firmware/CHANGELOG.md still has entries under [Unreleased]; move them into the section for $FIRMWARE_VERSION"
              exit 1
            fi
            if [ "$app_release" = false ]; then
              echo "::error::Firmware $FIRMWARE_VERSION is new, but app $APP_VERSION is already released; raise the app version so the app ships the new firmware"
              exit 1
            fi
          fi
          echo "app_release=$app_release" >> "$GITHUB_OUTPUT"
          echo "firmware_release=$firmware_release" >> "$GITHUB_OUTPUT"

  firmware:
    needs: version
    if: needs.version.outputs.app_release == 'true' || needs.version.outputs.firmware_release == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/espup
            ~/.cargo/bin/espflash
          key: firmware-tools-${{ runner.os }}-${{ hashFiles('flexpad-firmware/rust-toolchain.toml') }}

      - name: Install ESP32-S3 toolchain
        run: |
          command -v espup || cargo install espup --locked
          command -v espflash || cargo install espflash --locked
          espup install --targets esp32s3 --export-file "$HOME/export-esp.sh"

      - name: Build firmware image
        working-directory: flexpad-firmware
        env:
          VERSION: ${{ needs.version.outputs.firmware_version }}
        run: |
          . "$HOME/export-esp.sh"
          cargo build --release --locked
          mkdir -p ../dist
          image="FlexPad-firmware-$VERSION-esp32s3.bin"
          espflash save-image --chip esp32s3 --merge --skip-padding --flash-size 8mb \
            --partition-table partitions.csv \
            target/xtensa-esp32s3-none-elf/release/flexpad-firmware "../dist/$image"
          cd ../dist
          test "$(head -c 1 "$image" | od -An -tx1 | tr -d ' ')" = "e9"
          test "$(wc -c < "$image")" -le $((0x410000))
          sha256sum "$image" > "$image.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            dist/*.bin
            dist/*.sha256
          if-no-files-found: error

  build:
    needs: [version, firmware]
    if: needs.version.outputs.app_release == 'true' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            suffix: -portable
            binary: flexpad.exe
            packaged: FlexPad.exe
          - os: ubuntu-latest
            platform: linux-x64
            suffix: ""
            binary: flexpad
            packaged: flexpad
          - os: macos-latest
            platform: macos-arm64
            suffix: ""
            binary: flexpad
            packaged: FlexPad
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware

      - name: Build app
        working-directory: flexpad-desktop
        shell: bash
        env:
          FIRMWARE_VERSION: ${{ needs.version.outputs.firmware_version }}
        run: |
          image="$GITHUB_WORKSPACE/firmware/FlexPad-firmware-$FIRMWARE_VERSION-esp32s3.bin"
          test -f "$image"
          FLEXPAD_FIRMWARE_IMAGE="$image" cargo build --release --locked
          if [ "$RUNNER_OS" = Linux ]; then
            FLEXPAD_FIRMWARE_IMAGE="$image" cargo test --release --locked embedded_image
          fi

      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          name="FlexPad-${{ needs.version.outputs.app_version }}-${{ matrix.platform }}${{ matrix.suffix }}"
          mkdir -p "dist/$name"
          cp "flexpad-desktop/target/release/${{ matrix.binary }}" "dist/$name/${{ matrix.packaged }}"
          cp LICENSE README.md flexpad-desktop/CHANGELOG.md "dist/$name/"
          cd dist
          case "${{ runner.os }}" in
            Windows) 7z a -tzip -bso0 "$name.zip" "$name" && archive="$name.zip" ;;
            *) tar -czf "$name.tar.gz" "$name" && archive="$name.tar.gz" ;;
          esac
          sha256sum "$archive" > "$archive.sha256"

      - name: Package Linux packages
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          package_version="${VERSION//-/\~}"
          stage="$RUNNER_TEMP/package/root"
          mkdir -p "$stage/usr/bin" "$stage/usr/share/applications" "$stage/usr/share/doc/flexpad"
          install -m 755 flexpad-desktop/target/release/flexpad "$stage/usr/bin/flexpad"
          install -m 644 installer/linux/flexpad.desktop "$stage/usr/share/applications/flexpad.desktop"
          for size in 16 32 64 128 256; do
            install -D -m 644 "assets/icons/icon-$size.png" "$stage/usr/share/icons/hicolor/${size}x${size}/apps/flexpad.png"
          done
          install -D -m 644 assets/icons/icon.svg "$stage/usr/share/icons/hicolor/scalable/apps/flexpad.svg"
          install -m 644 LICENSE README.md flexpad-desktop/CHANGELOG.md installer/linux/copyright "$stage/usr/share/doc/flexpad/"

          deb="dist/flexpad_${package_version}_amd64.deb"
          deb_root="$RUNNER_TEMP/package/deb"
          mkdir -p "$deb_root/DEBIAN"
          cp -R "$stage/." "$deb_root/"
          size=$(du -sk "$deb_root" | cut -f 1)
          sed -e "s/APP_VERSION/$package_version/" -e "s/INSTALLED_SIZE/$size/" installer/linux/control > "$deb_root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$deb_root" "$deb"

          sudo apt-get install -y --no-install-recommends rpm > /dev/null
          rpm_top="$RUNNER_TEMP/package/rpmbuild"
          sed "s/APP_VERSION/$package_version/" installer/linux/flexpad.spec > "$RUNNER_TEMP/package/flexpad.spec"
          rpmbuild -bb --quiet --define "_topdir $rpm_top" --define "_sourcedir $RUNNER_TEMP/package" "$RUNNER_TEMP/package/flexpad.spec"
          cp "$rpm_top"/RPMS/x86_64/*.rpm dist/

          cd dist
          for package in *.deb *.rpm; do
            sha256sum "$package" > "$package.sha256"
          done

      - name: Check Linux packages
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --info dist/*.deb
          rpm -qpi dist/*.rpm
          rpm -qpR dist/*.rpm | grep -q 'libudev.so.1'
          rpm -qlp dist/*.rpm | grep -q '^/usr/share/icons/hicolor/256x256/apps/flexpad.png$'
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/flexpad
          test -f /usr/share/applications/flexpad.desktop
          desktop-file-validate /usr/share/applications/flexpad.desktop || true
          if ldd /usr/bin/flexpad | grep 'not found'; then
            echo "::error::The installed app has missing libraries"
            exit 1
          fi

      - name: Package macOS app
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          name="FlexPad-$VERSION-${{ matrix.platform }}"
          app="dist/$name/FlexPad.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "flexpad-desktop/target/release/${{ matrix.binary }}" "$app/Contents/MacOS/FlexPad"
          cp flexpad-desktop/target/release/FlexPad.icns "$app/Contents/Resources/FlexPad.icns"
          sed "s/APP_VERSION/$VERSION/g" installer/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          cp LICENSE README.md flexpad-desktop/CHANGELOG.md "dist/$name/"
          ln -s /Applications "dist/$name/Applications"
          hdiutil create -volname FlexPad -srcfolder "dist/$name" -ov -format UDZO "dist/$name.dmg"
          cd dist
          shasum -a 256 "$name.dmg" > "$name.dmg.sha256"

      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.app_version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          & $compiler /Qp "/DAppVersion=$env:VERSION" installer\FlexPad.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location dist
          $setup = "FlexPad-$env:VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$setup" | Out-File -Encoding ascii -NoNewline "$setup.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error


  release-firmware:
    needs: [version, firmware]
    if: github.event_name != 'pull_request' && needs.version.outputs.firmware_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            flexpad-firmware/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Create firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VERSION: ${{ needs.version.outputs.firmware_version }}
        run: |
          bash .github/scripts/publish-release.sh "firmware-v$VERSION" "FlexPad firmware $VERSION" "$VERSION" \
            flexpad-firmware/CHANGELOG.md false dist/*

  release-app:
    needs: [version, build, release-firmware]
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.version.outputs.app_release == 'true'
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release-firmware.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            flexpad-desktop/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-*"
          path: dist
          merge-multiple: true

      - name: Create app release
        env:
          GH_TOKEN: ${{ github.token }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          VERSION: ${{ needs.version.outputs.app_version }}
          FIRMWARE_VERSION: ${{ needs.version.outputs.firmware_version }}
        run: |
          export EXTRA_NOTES="Includes firmware $FIRMWARE_VERSION ([firmware-v$FIRMWARE_VERSION](https://github.com/${{ github.repository }}/releases/tag/firmware-v$FIRMWARE_VERSION)). · Enthält Firmware $FIRMWARE_VERSION."
          bash .github/scripts/publish-release.sh "v$VERSION" "FlexPad $VERSION" "$VERSION" \
            flexpad-desktop/CHANGELOG.md true dist/*

  discord-firmware:
    needs: [version, release-firmware]
    uses: TripleT3005/TripleT3005/.github/workflows/discord-release.yml@main
    with:
      title: FlexPad Firmware ${{ needs.version.outputs.firmware_version }}
      version: ${{ needs.version.outputs.firmware_version }}
      tag: firmware-v${{ needs.version.outputs.firmware_version }}
      changelog: flexpad-firmware/CHANGELOG.md
      page: flexpad
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  discord-app:
    needs: [version, release-app]
    if: ${{ !cancelled() && needs.release-app.result == 'success' }}
    uses: TripleT3005/TripleT3005/.github/workflows/discord-release.yml@main
    with:
      title: FlexPad ${{ needs.version.outputs.app_version }}
      version: ${{ needs.version.outputs.app_version }}
      tag: v${{ needs.version.outputs.app_version }}
      changelog: flexpad-desktop/CHANGELOG.md
      page: flexpad
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
